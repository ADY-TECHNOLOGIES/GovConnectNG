<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <!-- PWA -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO -->
    <meta
      name="description"
      content="GovConnect NG is a citizen reporting and public service platform connecting Nigerians with government. Report community problems, access government services, track complaints, and promote transparency."
    />

    <meta
      name="keywords"
      content="GovConnect NG, Nigeria, citizen reporting, government services, local government, public services, community reporting, transparency, civic technology, government accountability"
    />

    <meta
      name="author"
      content="Anas Dalhatu Yahuza"
    />

    <meta
      name="creator"
      content="Anas Dalhatu Yahuza"
    />

    <meta
      name="publisher"
      content="ADY Technologies"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0B5D1E"
    />

    <!-- Web App -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="application-name"
      content="GovConnect NG"
    />

    <!-- Apple / iOS -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="GovConnect NG"
    />

    <!-- Phone number detection -->
    <meta
      name="format-detection"
      content="telephone=no"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="GovConnect NG | Citizen Reporting & Public Services"
    />

    <meta
      property="og:description"
      content="Connect with government, report community problems, access public services, track complaints, and promote transparency with GovConnect NG."
    />

    <meta
      property="og:image"
      content="/favicon.ico"
    />

    <meta
      property="og:site_name"
      content="GovConnect NG"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="GovConnect NG | Citizen Reporting & Public Services"
    />

    <meta
      name="twitter:description"
      content="A Nigerian citizen reporting and public service platform connecting citizens with government."
    />

    <meta
      name="twitter:image"
      content="/favicon.ico"
    />

    <!-- Title -->
    <title>
      🇳🇬 GovConnect NG | Citizen Reporting Platform
    </title>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
